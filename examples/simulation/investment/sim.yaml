apiVersion: sim/v1
id: investment-allocation
graph: ./graph.yaml
worlds:
  bull:
    p_crash: 0.05
    daily_upside_m: 2500.0
    doubler_payout_m: 1024.0
  moderate:
    p_crash: 0.30
    daily_upside_m: 1800.0
    doubler_payout_m: 1024.0
  crisis:
    p_crash: 0.75
    daily_upside_m: 1200.0
    doubler_payout_m: 1024.0
latents:
  market_crash:
    bernoulli:
      p: "world.p_crash"
behaviors:
  market_signal:
    cost: 5
    duration: 24h
    output:
      signal:
        choice:
          favorable: "latent.market_crash ? 0.15 : 0.85"
          cautious: "latent.market_crash ? 0.85 : 0.15"
  invest_daily:
    cost: 20
    duration: 438000h
  invest_doubler:
    cost: 5
    duration: 438000h
objective:
  name: terminal_wealth
  value: "nodes.invest_doubler.status == 'Succeeded' ? double(world.doubler_payout_m) : (nodes.invest_daily.status == 'Succeeded' ? (latent.market_crash ? 0.1 : double(world.daily_upside_m)) : 0.0)"
  maximize: mean
metrics:
  ruin_rate: "nodes.invest_daily.status == 'Succeeded' && latent.market_crash ? 1.0 : 0.0"
  terminal_wealth: "nodes.invest_doubler.status == 'Succeeded' ? double(world.doubler_payout_m) : (nodes.invest_daily.status == 'Succeeded' ? (latent.market_crash ? 0.1 : double(world.daily_upside_m)) : 0.0)"
