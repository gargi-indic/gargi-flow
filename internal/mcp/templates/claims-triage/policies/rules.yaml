apiVersion: policy/v1
id: rules-baseline
version: "1"
params:
  theta:
    min: 0.8
    max: 1.0
    default: 0.90
  adjusters:
    values: [10]
    default: 10
decisions:
  route:
    rules:
      - when: "ai_assess.output.confidence >= params.theta"
        choose: auto_pay
      - when: "ai_assess.output.confidence <= 0.3"
        choose: fraud_unit
      - else: adjuster
